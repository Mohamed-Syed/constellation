# Constellation — federated tool catalog (P3 portal federation)
#
# Heavyweight platforms that are NOT bundled into the core are advertised here
# so the portal can render a tile for each and open it via its SSO-proxied URL.
# SSO + reverse proxy are a later P3 item; until then, set `url` to the address
# the tool is reachable at (e.g. its LAN/proxy URL). The portal opens `url` in a
# new tab. Add/remove entries freely — the loader tolerates missing keys.
#
# Keys per tool:
#   id          stable slug (required)
#   name        display name
#   description one-line summary
#   icon        lucide icon name (matches apps/web/src/lib/icons.ts)
#   url         proxied/open URL (omit if not wired yet)
#   status      live | provisioning | planned | (blank = unknown)
#   category    grouping label (defaults to "General")

tools:
  - id: grafana
    name: Grafana
    description: Dashboards and observability over Prometheus/Loki metrics and logs.
    icon: LineChart
    url: https://grafana.local.constellation
    status: live
    category: Observability

  - id: langflow
    name: Langflow
    description: Visual builder for agent and RAG flows; published flows are callable as tools.
    icon: Workflow
    url: https://langflow.local.constellation
    status: live
    category: Agents

  - id: openwebui
    name: Open WebUI
    description: Self-hosted chat UI kept alongside the in-house assistant (per C7).
    icon: MessagesSquare
    url: https://chat.local.constellation
    status: live
    category: Agents

  - id: coolify
    name: Coolify
    description: Self-hosted PaaS that deploys and keeps the whole stack alive.
    icon: Rocket
    url: https://coolify.local.constellation
    status: provisioning
    category: Infrastructure

  - id: openhands
    name: OpenHands
    description: Agentic coding delegate for large, repo-spanning jobs.
    icon: Terminal
    status: planned
    category: Agents

  - id: graphify
    name: Graphify
    description: Knowledge-graph memory over modules and docs via MCP.
    icon: Share2
    status: planned
    category: Knowledge
