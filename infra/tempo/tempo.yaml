# Tempo — distributed tracing backend (Phase 2.0, OTel).
# Minimal local config: OTLP receivers (gRPC :4317 + HTTP :4318), query API
# (:3200), local-file storage. Grafana (federation overlay) is provisioned
# with a Tempo datasource so traces are explorable as a portal tile.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  trace_idle_period: 10s
  max_block_bytes: 1_000_000
  max_block_duration: 5m

compactor:
  compaction:
    compaction_window: 1h
    max_block_bytes: 100_000_000
    block_retention: 24h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

usage_report:
  reporting_enabled: false
