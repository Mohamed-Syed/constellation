# ---------------------------------------------------------------------------
# Constellation — Prometheus scrape config (P3 observability tile; extended
# Phase 2.0 2.3 — the api HAS exposed /api/metrics since ac2cf11, and the
# host-dev job below makes a host-booted api (scripts/boot-api-v0.3.sh on
# :4001) observable by the in-docker Prometheus/Grafana stack. Targets that
# are DOWN are honest: the corresponding service isn't running right now.
# ---------------------------------------------------------------------------

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: constellation

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Core NestJS API in the compose stack (api container, port 4000).
  - job_name: constellation-api
    metrics_path: /api/metrics
    static_configs:
      - targets: ["api:4000"]
        labels:
          service: core-api

  # Host-booted dev API (scripts/boot-api-v0.3.sh runs on :4001 OUTSIDE
  # compose) — Docker Desktop resolves host.docker.internal to the host.
  - job_name: constellation-api-host
    metrics_path: /api/metrics
    static_configs:
      - targets: ["host.docker.internal:4001"]
        labels:
          service: core-api-host

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          service: grafana
