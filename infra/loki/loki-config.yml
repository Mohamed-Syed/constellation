# ---------------------------------------------------------------------------
# Loki — single-binary filesystem config for local federation.
# Not production-tuned: no object storage, no retention policy, no HA.
# ---------------------------------------------------------------------------

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # NOTE: `metric_aggregation_enabled` is NOT a limits_config field in Loki
  # 3.2.x — it lives under `pattern_ingester`. Leaving it here made the
  # container crash-loop on "field not found in type validation.plain".
  allow_structured_metadata: true

pattern_ingester:
  enabled: true
  metric_aggregation:
    enabled: true

ruler:
  alertmanager_url: http://localhost:9093
