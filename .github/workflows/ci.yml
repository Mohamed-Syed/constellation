name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# One in-flight run per ref; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  # `prisma generate` runs during the API build. prisma.config.ts falls back
  # to a placeholder when this is unset, but being explicit keeps the log
  # clean and documents that CI never talks to a real database.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/constellation_ci?schema=core

jobs:
  build:
    name: install / build / typecheck / test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must be on PATH before setup-node so setup-node's built-in pnpm
      # cache resolver can find the store path.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # Matches "packageManager": "pnpm@9.12.3" in package.json.
          version: 9.12.3
          run_install: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Explicit store cache on top of setup-node's: keyed on the lockfile so
      # a dependency change invalidates it, with a prefix fallback for
      # partial reuse.
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache turbo build outputs
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Build first: typecheck and test both depend on the SDK's emitted
      # d.ts files (turbo.json declares dependsOn ^build).
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  docker:
    name: docker compose build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate compose file
        run: docker compose config --quiet

      # P3: the federation overlay must also stay syntactically valid. Config
      # validation only — the federated stack itself (Keycloak, Grafana, Loki,
      # Langflow, Open WebUI) is far too heavy to boot on a CI runner.
      - name: Validate federation overlay
        run: |
          docker compose -f docker-compose.yml -f docker-compose.federation.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.federation.yml \
            --profile federation config --quiet

      # Guard the opt-in gate: without the profile, the overlay must resolve
      # to exactly the 4 base services. If someone drops `profiles:` from a
      # federated service, `docker compose up` would silently start it.
      - name: Assert federation services are opt-in
        run: |
          services=$(docker compose -f docker-compose.yml -f docker-compose.federation.yml \
            config --services | sort | tr '\n' ' ')
          echo "resolved without profile: $services"
          if [ "$services" != "api postgres redis web " ]; then
            echo "::error::Federation services leaked into the default stack: $services"
            exit 1
          fi

      # Proves the deploy path stays green, not just the workspace build.
      # No push — images stay local to the runner.
      - name: Build images
        run: docker compose build
